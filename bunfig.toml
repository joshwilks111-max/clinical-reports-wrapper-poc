[test]
coverage = true
# Per T3 of the design brief — line coverage is the locked CI gate.
# Function/statement thresholds disabled: bun counts default-arg lambdas as
# separate functions, which trips on CLI entry points that only run via the
# child-process smoke path.
coverageThreshold = { line = 0.9, function = 0.0, statement = 0.0 }
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
